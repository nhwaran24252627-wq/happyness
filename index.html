<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#160d1e">
  <meta name="description" content="A private, full-screen collection of memories.">
  <title>Happiness — Memories</title>
  <link rel="stylesheet" href="style.css?v=20261003-continuous">
</head>
<body>
  <div class="ambient" aria-hidden="true">
    <div class="aurora aurora-one"></div>
    <div class="aurora aurora-two"></div>
    <div class="grain"></div>
    <div class="sparkles"></div>
  </div>

  <header class="topbar">
    <div class="brand">
      <p class="eyebrow">A little collection</p>
      <h1>Happi<span>ness</span></h1>
      <p class="intro">Scroll slowly. Every memory stays in its own shape.</p>
    </div>
    <div class="topbar-actions">
      <p id="memoryCount" class="memory-count" aria-live="polite">Preparing memories</p>
      <button id="muteAll" class="icon-button" type="button" aria-label="Unmute videos" title="Unmute videos">
        <span aria-hidden="true">🔇</span>
      </button>
    </div>
  </header>

  <main id="gallery" class="gallery" aria-live="polite" aria-busy="true">
    <section class="state-card loading-state">
      <div class="loading-orbit" aria-hidden="true">✦</div>
      <p class="state-kicker">Just a moment</p>
      <h2>Loading memories…</h2>
      <p>Reading the assets folder.</p>
    </section>
  </main>

  <template id="emptyTemplate">
    <section class="state-card empty-state">
      <div class="state-icon" aria-hidden="true">♡</div>
      <p class="state-kicker">Nothing here yet</p>
      <h2>No photos or videos found</h2>
      <p>Add image or video files to the <code>assets</code> folder, then refresh this page.</p>
    </section>
  </template>

  <template id="errorTemplate">
    <section class="state-card error-state" role="alert">
      <div class="state-icon" aria-hidden="true">!</div>
      <p class="state-kicker">The gallery needs its local server</p>
      <h2>Memories can’t be loaded from this page.</h2>
      <p class="error-detail"></p>
      <ol class="start-steps">
        <li>Open a terminal in this project folder.</li>
        <li>Run <code>npm start</code>.</li>
        <li>Open <code>http://localhost:3000</code>.</li>
      </ol>
      <button class="retry-button" type="button">Try again</button>
    </section>
  </template>

  <noscript>
    <div class="noscript-message">
      This gallery needs JavaScript and its local server. Run <code>npm start</code>, then open <code>http://localhost:3000</code>.
    </div>
  </noscript>

  <script src="app.js"></script>
</body>
</html>
